name: Keep Render Backend Awake

on:
  schedule:
    # Ping Render every 10 minutes so the free tier never sleeps during Googlebot crawls
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping FondPeace Render Backend
        run: |
          echo "Pinging FondPeace Render backend at $(date -u)"
          curl -fsS --max-time 60 --retry 2 --retry-delay 5 https://backendk-z915.onrender.com/health || curl -fsS --max-time 60 https://backendk-z915.onrender.com/
          echo ""
          echo "Keep-alive ping succeeded."
